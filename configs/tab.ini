// Отображение уровня в TAB (скорборде).
//
// Механизм: тип 12 рисует у клиента иконку panorama/images/icons/skillgroups/
// skillgroup{value}.svg. Значения 1..18 — стандартные звания ММ; наши кастомные
// бейджи лежат в workshop-аддоне под ID 50..70 и скачиваются клиентом при
// заходе (MultiAddonManager). Если иконки нет у клиента — рисуется шеврон «>».
//
// ВАЖНО (иначе ERROR_FILEOPEN skillgroupN.vsvg_c при «смонтированном» аддоне):
//  1. SVG класть в content/csgo_addons/<addon>/panorama/images/icons/skillgroups/
//     (НЕ в game/csgo_addons — иначе файлы не компилируются в .vsvg_c).
//  2. В cfg/multiaddonmanager/multiaddonmanager.cfg:
//       mm_extra_addons "<workshop_id>"
//     Не полагайтесь только на mm_client_extra_addons — сервер тогда не
//     монтирует аддон (в логе: Refreshing addons ()), и клиент часто
//     запрашивает иконку до готовности VPK.
//  3. workshop_id ниже дублирует ID в MultiAddonManager через API плагина.
//
// Соответствие «файл в ranks/ -> ID -> уровень» — ranks/README.md.
// Подбор/проверка ID: lr_tab_test <steamid64> <value>.
"LR_Tab"
{
	"tab_enabled"		"1"

	"tab_mode"			"competitive"

	// Число «побед» — должно быть > 0, иначе клиент может не показать ранг
	"tab_wins"			"10"

	// Тип отображения: 12 = иконки skillgroup{value}.svg
	"tab_type"			"12"

	// Workshop ID аддона с skillgroup50..70.svg (perfecteam_ranks).
	// Пустая строка = не трогать MultiAddonManager из плагина.
	"workshop_id"		""

	// Секунды после загрузки игрока / смены карты, прежде чем писать
	// кастомные skillgroup ID (>18). Даёт MultiAddonManager закончить
	// reconnect/download. Слишком рано → ResourceSystem кэширует FILEOPEN.
	"tab_icons_delay"		"12"

	// После первой записи ещё столько секунд принудительно dirty'ить поля
	// и слать ServerRankRevealAll (Panorama повторно тянет .vsvg_c).
	"tab_icons_refresh"		"20"

	// Периодический ServerRankRevealAll всем (как в FatherAlexiy FakeRank).
	// 0 = только при загрузке / открытии TAB.
	"tab_reveal_interval"	"2"

	// value на каждый уровень: ID кастомных SVG из аддона проекта.
	// skillgroup50..69 = номерные бейджи «1»..«20»
	"Levels"
	{
		"1"		"50"
		"2"		"51"
		"3"		"52"
		"4"		"53"
		"5"		"54"
		"6"		"55"
		"7"		"56"
		"8"		"57"
		"9"		"58"
		"10"	        "59"
		"11"	        "60"
		"12"	        "61"
		"13"	        "62"
		"14"	        "63"
		"15"	 	"64"
		"16"    	"65"
		"17"	        "66"
		"18"		"67"
		"19"		"68"
		"20"		"69"
	}

	// «Логотип проекта» для 21 уровня и выше: skillgroup70.svg
	"AboveMax"
	{
		"tab_type"	"12"
		"value"		"70"
		"use_exp"	"0"
	}
}
