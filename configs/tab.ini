// Отображение уровня в TAB (скорборде).
//
// Механизм: тип 12 рисует у клиента иконку panorama/images/icons/skillgroups/
// skillgroup{value}.svg. Значения 1..18 — стандартные звания ММ; наши кастомные
// бейджи (цвета-«световая волна» + логотип проекта) лежат в workshop-аддоне
// проекта под ID 50..70 и скачиваются клиентом при заходе (MultiAddonManager).
// Если иконки нет у клиента (аддон не смонтирован) — рисуется шеврон «>».
//
// Соответствие «файл в ranks/ -> ID -> уровень» описано в ranks/README.md.
// Значения ниже обязаны совпадать и с ним, и с секцией Ranks в settings.ini.
//
// Режимы (tab_mode):
//   "competitive" — колонка соревновательного ранга (ДЕФОЛТ, наш вариант)
//   "persona"     — бейдж уровня профиля слева от ника (не работает для
//                   подделки: клиент берёт данные из Steam; оставлен как опция)
//
// Подбор/проверка ID: в консоли сервера lr_tab_test <steamid64> <value>.
"LR_Tab"
{
	"tab_enabled"		"1"

	"tab_mode"			"competitive"

	// Число «побед» — должно быть > 0, иначе клиент может не показать ранг
	"tab_wins"			"10"

	// Тип отображения: 12 = иконки skillgroup{value}.svg
	"tab_type"			"12"

	// value на каждый уровень: ID кастомных SVG из аддона проекта.
	// skillgroup50..69 = номерные бейджи «1»..«20» (волна синий->зелёный->
	// фиолетовый->красный), по 5 бейджей на цвет.
	"Levels"
	{
		"1"		"50"
		"2"		"51"
		"3"		"52"
		"4"		"53"
		"5"		"54"
		"6"		"55"
		"7"		"56"
		"8"		"57"
		"9"		"58"
		"10"	"59"
		"11"	"60"
		"12"	"61"
		"13"	"62"
		"14"	"63"
		"15"	"64"
		"16"	"65"
		"17"	"66"
		"18"	"67"
		"19"	"68"
		"20"	"69"
	}

	// «Логотип проекта» для 21 уровня и выше: skillgroup70.svg
	// (в settings.ini это rank_21 «Маршал» и rank_22 «Легенда»)
	"AboveMax"
	{
		"tab_type"	"12"
		"value"		"70"
		"use_exp"	"0"
	}
}
