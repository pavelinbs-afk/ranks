// Levels Ranks Core (lr_core) — основной конфиг
"LR_Settings"
{
	"MainSettings"
	{
		// Имя таблицы в БД (латиница, до 32 символов). Для нескольких серверов с общей
		// статистикой используйте одну таблицу, с раздельной — разные.
		"lr_table"					"lvl_ranks"

		// Язык сообщений (ключ из файла переводов): ru / en
		"lr_language"				"ru"

		// ID сервера — пишется в колонку `online`, когда игрок на сервере (0 в оффлайне)
		"lr_server_id"				"1"

		// Тип статистики:
		//  0 — накопительная (очки за действия, уровни по порогам Ranks)
		//  1 — рейтинговая расширенная (аналог HLstatsX, старт 1000, очки от уровня жертвы)
		//  2 — рейтинговая простая (аналог RankMe)
		// При смене типа обнулите статистику в БД!
		"lr_type_statistics"		"0"

		// Минимум игроков (в командах) для начисления опыта
		"lr_minplayers_count"		"0"

		// Разрешить игрокам сбрасывать свою статистику (!resetstats) [0/1]
		"lr_show_resetmystats"		"1"
		// Кулдаун повторного сброса статистики, сек
		"lr_resetmystats_cooldown"	"86400"

		// Сообщения о начислении опыта: 0 — нет, 1 — за каждое действие, 2 — итог в конце раунда
		"lr_show_usualmessage"		"1"

		// Сообщение-подсказка при старте раунда [0/1]
		"lr_show_spawnmessage"		"1"

		// Сообщать игроку о повышении/понижении уровня [0/1]
		"lr_show_levelup_message"	"1"
		"lr_show_leveldown_message"	"1"
		// Сообщать всем о смене уровня игрока [0/1]
		"lr_show_all_levelup_message"	"1"
		"lr_show_all_leveldown_message"	"0"

		// Показывать !rank всем (1) или только себе (0)
		"lr_show_rankmessage"		"1"

		// Количество игроков в !top / !toptime
		"lr_top_count"				"10"

		// Очки новому игроку при первом заходе (только для накопительной системы)
		"lr_start_points"			"0"

		// Начислять ли опыт после окончания раунда [0/1]
		"lr_giveexp_roundend"		"1"

		// Блокировать начисление опыта в разминке [0/1]
		"lr_block_warmup"			"1"

		// Режим "все против всех" — не считать убийства союзников тимкиллом [0/1]
		"lr_allagainst_all"			"0"

		// Скрывать из топа игроков, не заходивших N дней (0 — отключить)
		"lr_cleandb_days"			"30"

		// Режим сохранения: 0 — только при выходе, 1 — + при смене уровня и в конце раунда
		"lr_db_savedataplayer_mode"	"1"
	}

